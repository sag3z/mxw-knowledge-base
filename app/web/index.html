<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MXW · база знаний</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="stylesheet" href="/web/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%23e5397b'/><text x='50' y='71' font-size='62' font-family='Segoe UI,Arial' font-weight='700' fill='white' text-anchor='middle'>M</text></svg>">
<script src="/web/lib/force-graph.min.js"></script>
<script src="/web/lib/d3.min.js"></script>
<script src="/web/lib/marked.min.js"></script>
</head>
<body>
<!-- левая боковая панель (стиль claude.ai) -->
<aside id="side">
  <div class="side-top">
    <span class="brand-mark">M</span>
    <span class="side-brand">MXW <span>база знаний</span></span>
    <button id="sideBurger" class="btn ghost icon" title="Свернуть панель"><span data-ic="panel"></span></button>
  </div>
  <button id="newChat" class="btn newchat" title="Новый чат"><span class="ic" data-ic="pen"></span><span class="lbl">Новый чат</span></button>
  <nav id="nav">
    <a href="#/chat" data-route="chat"><span class="ic" data-ic="chat"></span><span class="lbl">Чат</span></a>
    <a href="#/map" data-route="map"><span class="ic" data-ic="map"></span><span class="lbl">Карта</span></a>
    <a href="#/events" data-route="events"><span class="ic" data-ic="calendar"></span><span class="lbl">Активности</span></a>
    <a href="#/people" data-route="people"><span class="ic" data-ic="users"></span><span class="lbl">Люди</span></a>
    <a href="#/topics" data-route="topics"><span class="ic" data-ic="trending"></span><span class="lbl">Темы</span></a>
    <a href="#/articles" data-route="articles"><span class="ic" data-ic="book"></span><span class="lbl">Статьи</span></a>
  </nav>
  <div class="side-recent">
    <div class="side-h">Недавние</div>
    <ul id="recent"></ul>
  </div>
  <div class="side-bottom">
    <button id="anonBtn" class="btn ghost anon" title="Скрыть или показать ники участников чата"><span class="ic" data-ic="eye-off"></span><span class="lbl">Скрыть ники</span></button>
    <div id="slice" class="side-slice" title="Дата последнего сообщения в базе"></div>
  </div>
</aside>
<div id="sideVeil"></div>

<!-- верхняя панель на телефоне (< 900px) -->
<header id="mtop">
  <button id="mBurger" class="btn ghost icon" title="Меню"><span data-ic="menu" data-sz="20"></span></button>
  <span id="mTitle">Чат</span>
  <button id="mNew" class="btn ghost icon" title="Новый чат"><span data-ic="pen" data-sz="20"></span></button>
</header>

<!-- основная область: текущий раздел -->
<main id="main">
  <div id="views">
    <section class="view" data-view="chat"></section>
    <section class="view" data-view="map">
      <div class="view-head">
        <div class="view-title">
          <h1>Карта</h1>
          <p class="sub">Каждая точка — разговор. Цвет — тема, размер — сколько сообщений. Нажми на точку, чтобы прочитать</p>
        </div>
        <div class="seg" id="mapSeg">
          <button data-v="topics" title="По темам — похожие по смыслу разговоры рядом, независимо от ветки чата">По темам</button>
          <button data-v="branches" title="По веткам — разговоры сгруппированы по веткам чата">По веткам</button>
        </div>
      </div>
      <div class="map-wrap">
        <div id="graph"></div>
        <div class="map-load" id="mapLoad"><span class="loading">Загружаю карту</span></div>
        <div id="legend" title="Категории: клик — скрыть/показать на карте"></div>
        <div id="timeline">
          <button id="play" title="Проиграть рост базы во времени"></button>
          <div id="tl"><canvas id="hist"></canvas><input id="slider" type="range" min="0" max="1000" value="1000" title="Ползунок времени: показать базу до выбранной даты"></div>
          <div class="tl-right"><div id="tlabel">сейчас</div><div class="tl-hint">Перетащи, чтобы увидеть, как росла база</div></div>
        </div>
      </div>
    </section>
    <section class="view" data-view="events"></section>
    <section class="view" data-view="people"></section>
    <section class="view" data-view="topics"></section>
    <section class="view" data-view="articles"></section>
  </div>
</main>

<!-- правая выезжающая панель: разговор / статья -->
<div id="drawerWrap">
  <div id="drawerVeil"></div>
  <aside id="drawer">
    <div id="dhead">
      <button id="dback" class="btn ghost icon" title="Назад" hidden><span data-ic="arrow-left"></span></button>
      <span id="dtitle"></span>
      <button id="dmore" class="btn ghost icon" data-act="dmore" title="Подробнее: скопировать id разговора или путь статьи"><span data-ic="more"></span></button>
      <button id="dclose" class="btn ghost icon" title="Закрыть (Esc)"><span data-ic="x"></span></button>
    </div>
    <div id="dbody"></div>
  </aside>
</div>

<!-- полноэкранный просмотр фото -->
<div id="viewer"><img id="vimg" alt=""><button id="vprev" class="vbtn" title="Предыдущее фото (←)"><span data-ic="chev-left" data-sz="22"></span></button><button id="vnext" class="vbtn" title="Следующее фото (→)"><span data-ic="chev-right" data-sz="22"></span></button><button id="vclose" class="vx" title="Закрыть просмотр (Esc)"><span data-ic="x" data-sz="20"></span></button><span id="vcnt"></span></div>

<div id="tip"></div>

<script type="module" src="/web/js/main.js"></script>
</body>
</html>
